name: TBAR Collector

on:
  workflow_dispatch:
  push:
    paths:
      - 'public/data/manual-inbox.json'
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

concurrency:
  group: tbar-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect source candidates
        run: npm run collect

      - name: Merge curated and manual sources
        run: node scripts/merge-manual.mjs

      - name: Commit changed data only
        shell: bash
        run: |
          git add public/data/candidates.json public/data/collector-state.json
          if git diff --cached --quiet; then
            echo "No candidate changes. Nothing to commit."
            exit 0
          fi
          git config user.name "tbar-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh TBAR candidates [skip ci]"
          git push
