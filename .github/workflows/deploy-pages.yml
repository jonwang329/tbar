name: Deploy TBAR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify live production TBAR V1.1
        shell: bash
        run: |
          set -euo pipefail
          url="https://jonwang329.github.io/tbar/"
          html=""
          for i in {1..18}; do
            html="$(curl -fsSL "$url" || true)"
            if grep -q 'TBAR V1.1' <<<"$html"; then
              break
            fi
            sleep 5
          done
          test -n "$html"
          grep -q 'TBAR V1.1' <<<"$html"
          grep -q 'Executive Snapshot' <<<"$html"
          grep -q 'four different questions — not repeated stories' <<<"$html"
          grep -q '1. Must Know' <<<"$html"
          grep -q '2. Important People / Video Intelligence' <<<"$html"
          grep -q '<details class="leader"' <<<"$html"
          grep -q '<summary>' <<<"$html"
          grep -q '哈佛老徐 / 徐彬' <<<"$html"
          grep -q '不是只收「影片連結」，而是收「他到底講了什麼」' <<<"$html"
          grep -q 'Watch / latest feed' <<<"$html"
          grep -q 'Why it matters' <<<"$html"
          grep -q 'Taiwan lens' <<<"$html"
          grep -q 'HPE lens' <<<"$html"
          grep -q 'Dario Amodei' <<<"$html"
          grep -q 'Sam Altman' <<<"$html"
          grep -q 'Jensen Huang' <<<"$html"
          grep -q 'Elon Musk' <<<"$html"
          grep -q 'Demis Hassabis' <<<"$html"
          grep -q 'Sundar Pichai' <<<"$html"
          grep -q 'Satya Nadella' <<<"$html"
          grep -q 'Lisa Su' <<<"$html"
          grep -q 'Mark Zuckerberg' <<<"$html"
          grep -q 'Andy Jassy' <<<"$html"
          grep -q '簡立峰' <<<"$html"
          grep -q 'Taiwan Intelligence' <<<"$html"
          grep -q 'Country Deep Dive' <<<"$html"
          grep -q 'Executive Dashboard / Trend Analysis' <<<"$html"
          grep -q 'HPE Opportunity' <<<"$html"
          if grep -q 'id="zhBtn"\|id="enBtn"' <<<"$html"; then
            echo "Legacy V1.0 bilingual JS controls unexpectedly present" >&2
            exit 1
          fi
          echo "PRODUCTION_SMOKE_PASS_V1_1 $url"