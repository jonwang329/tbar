name: Deploy TBAR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify live production TBAR V1.0
        shell: bash
        run: |
          set -euo pipefail
          url="https://jonwang329.github.io/tbar/"
          html=""
          for i in {1..18}; do
            html="$(curl -fsSL "$url" || true)"
            if grep -q 'TBAR V1.0' <<<"$html"; then
              break
            fi
            sleep 5
          done
          test -n "$html"
          grep -q 'TBAR V1.0' <<<"$html"
          grep -q '四個不重複的 Summary' <<<"$html"
          grep -q '2. Important Signals' <<<"$html"
          grep -q 'Key AI Voices' <<<"$html"
          grep -q 'Dario Amodei' <<<"$html"
          grep -q 'Sam Altman' <<<"$html"
          grep -q 'Jensen Huang' <<<"$html"
          grep -q 'Elon Musk' <<<"$html"
          grep -q 'Sundar Pichai' <<<"$html"
          grep -q '哈佛老徐 / 徐彬' <<<"$html"
          grep -q 'Original-speaker source trail' <<<"$html"
          grep -q '簡立峰' <<<"$html"
          grep -q 'MOEA · AI Data Center' <<<"$html"
          grep -q 'Public Procurement' <<<"$html"
          grep -q 'Country Deep Dive' <<<"$html"
          grep -q 'Executive Dashboard / Trend Analysis' <<<"$html"
          grep -q 'HPE Opportunity' <<<"$html"
          grep -q 'id="zhBtn"' <<<"$html"
          grep -q 'id="enBtn"' <<<"$html"
          echo "PRODUCTION_SMOKE_PASS $url"
