name: Deploy TBAR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify live production TBAR V1.1
        shell: bash
        run: |
          set -euo pipefail
          url="https://jonwang329.github.io/tbar/"
          html=""
          for i in {1..18}; do
            html="$(curl -fsSL "$url" || true)"
            if grep -q 'TBAR V1.1' <<<"$html"; then
              break
            fi
            sleep 5
          done
          test -n "$html"
          required=(
            'TBAR V1.1'
            'Executive Snapshot'
            'four different questions — not repeated stories'
            '1. Must Know'
            '2. Important People / Video Intelligence'
            '<details class="leader"'
            '<summary>'
            '哈佛老徐 / 徐彬'
            '不是只收「影片連結」，而是收「他到底講了什麼」'
            'Watch / latest feed'
            'Why it matters'
            'Taiwan lens'
            'HPE lens'
            'Dario Amodei'
            'Sam Altman'
            'Jensen Huang'
            'Demis Hassabis'
            'Sundar Pichai'
            'Satya Nadella'
            'Lisa Su'
            'Mark Zuckerberg'
            'Andy Jassy'
            '簡立峰'
            '3. Taiwan Intelligence'
            '4. Country Deep Dive'
            '5. Executive Dashboard'
            'HPE Opportunity'
          )
          for marker in "${required[@]}"; do
            if ! grep -Fq "$marker" <<<"$html"; then
              echo "MISSING_PRODUCTION_MARKER: $marker" >&2
              exit 1
            fi
          done
          if grep -Eq 'id="(zhBtn|enBtn)"' <<<"$html"; then
            echo "Legacy V1.0 bilingual JS controls unexpectedly present" >&2
            exit 1
          fi
          echo "PRODUCTION_SMOKE_PASS_V1_1 $url"