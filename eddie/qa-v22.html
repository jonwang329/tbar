<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Eddie V22 QA</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f8fb;color:#17324d}.wrap{max-width:920px;margin:0 auto;padding:28px}.card{background:#fff;border:1px solid #dfe6ee;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 5px 18px rgba(20,45,75,.05)}h1{margin:0 0 6px;font-size:28px}.muted{color:#66788a}.pill{display:inline-block;border-radius:999px;padding:6px 10px;background:#eaf6ed;color:#356b42;font-weight:800;font-size:12px}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-block;text-decoration:none;border-radius:12px;padding:13px 18px;font-weight:800;border:1px solid #173b66;color:#173b66;background:#fff}.btn.primary{background:#173b66;color:#fff}.test{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #edf1f5}.test:last-child{border-bottom:0}.test input{width:22px;height:22px;margin-top:2px}.test b{display:block;margin-bottom:3px}.small{font-size:13px;color:#6d7e8e}.status{font-size:13px;margin-top:10px;padding:10px 12px;background:#f2f5f8;border-radius:10px}.ok{color:#2c6b3b}.warn{color:#9b5b19}.reset{border:0;background:none;color:#8b4b48;text-decoration:underline;cursor:pointer;padding:0}.progress{font-size:26px;font-weight:900;margin-top:6px}@media(max-width:640px){.wrap{padding:14px}.card{padding:17px}.btn{width:100%;box-sizing:border-box;text-align:center}}
</style></head><body><div class="wrap">
<div class="card"><span class="pill">V22 BASELINE · CORE LOGIC FROZEN</span><h1>Project Eddie Regression Test</h1><p class="muted">先把核心流程測穩，再繼續改 UI。這個 QA 頁不會改動 production scheduling logic。</p><div class="links"><a class="btn primary" target="_blank" href="./?view=coach&v=22qa">開 Coach Eddie</a><a class="btn" target="_blank" href="./?view=student&student=jon&v=22qa">開 Student Jon</a></div><div id="snapshot" class="status"></div></div>
<div class="card"><div class="small">REGRESSION GATE</div><div id="progress" class="progress">0 / 10</div><p class="muted">全部 10 項通過，才把下一版 UI 視為可接受。</p><div id="tests"></div><p class="small"><button class="reset" id="resetChecks">清除這次測試勾選</button></p></div>
</div>
<script>
const items=[
['新增最後一位學生','Add 一個全新的 Test Student，確認出現在學生列最後面。'],
['切換三種排課模式','固定時段 / 教練給選項 / 自由選空檔都能正常切換。'],
['切換 1 / 2 / 3 堂','每週堂數三種設定都能正常作用。'],
['Coach 提供可用時段','Coach 能指定固定時段、候選時段或開放空檔。'],
['Student 選課並確認','Student Portal 能選時間並 Confirm，Coach 畫面同步。'],
['確認前直接替換選項','選滿後直接點新時間，可以替換舊選擇，不需要先手動取消。'],
['確認後即時改課','Student 只看到真正有空的 availability，點新時間後立即完成。'],
['Coach 收到 NEW 紅色通知','改課後 Coach Dashboard 出現醒目的未讀異動提醒。'],
['Coach 按「我知道了」','按下後 unread / NEW 狀態正確清除。'],
['最後新增學生也完整可用','用剛新增的最後一位 Test Student 再跑選課→確認→改課，證明功能來自 StudentModule。']
];
const KEY='eddie-qa-v22',DATA='eddie-v18';let state=JSON.parse(localStorage.getItem(KEY)||'{}');
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){const box=document.getElementById('tests');box.innerHTML=items.map((x,i)=>`<label class="test"><input type="checkbox" data-i="${i}" ${state[i]?'checked':''}><span><b>${i+1}. ${x[0]}</b><span class="small">${x[1]}</span></span></label>`).join('');document.querySelectorAll('[data-i]').forEach(c=>c.onchange=()=>{state[c.dataset.i]=c.checked;save();renderProgress()});renderProgress();renderSnapshot()}
function renderProgress(){const n=items.filter((_,i)=>state[i]).length;const el=document.getElementById('progress');el.textContent=n+' / '+items.length;el.className='progress '+(n===items.length?'ok':'warn')}
function renderSnapshot(){let txt='Prototype data snapshot: ';try{const s=JSON.parse(localStorage.getItem(DATA)||'null');if(!s){txt+='尚未找到 V22 localStorage 資料。先開 Coach 畫面一次。'}else{const students=(s.students||[]).length,confirmed=Object.values(s.confirm||{}).filter(x=>x==='confirmed').length,unread=(s.notifications||[]).filter(x=>!x.seen).length;txt+=`Students ${students} · Confirmed ${confirmed} · NEW changes ${unread}`}}catch(e){txt+='資料讀取失敗'}document.getElementById('snapshot').textContent=txt}
document.getElementById('resetChecks').onclick=()=>{state={};save();render()};window.addEventListener('storage',renderSnapshot);render();
</script></body></html>
