<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Cisco Replacement Navigator</title><style>:root{--bg:#f4f8f6;--card:#fff;--ink:#15221d;--muted:#65736d;--line:#dbe6e1;--green:#01a982;--deep:#087a63;--soft:#edf8f4}*{box-sizing:border-box}body{margin:0;background:#e9f0ed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:var(--ink)}.app{max-width:460px;min-height:100vh;margin:auto;background:var(--bg)}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}header b{flex:1;font-size:14px}.mini{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;color:var(--deep)}main{padding:18px 14px 90px}.eyebrow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:900}h1{font-size:29px;line-height:1.08;margin:7px 0 8px}h2{font-size:20px;margin:0 0 8px}.lead{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;min-height:152px;display:flex;flex-direction:column;cursor:pointer}.tile.primary{grid-column:1/-1;min-height:166px;background:linear-gradient(180deg,#fff 0%,#f3fbf7 60%,#ebf7f2 100%);border-color:#b9ded2}.tile h2{font-size:18px;line-height:1.15;margin:10px 0 7px}.tile p{font-size:11.5px;line-height:1.4;color:var(--muted);margin:0}.go{margin-top:auto;padding-top:12px;font-size:11px;font-weight:900;color:var(--deep)}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:11px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:900;color:var(--muted);margin-bottom:6px}.say{background:#f8fbfa;border-left:4px solid var(--green);border-radius:10px;padding:12px;font-size:13px;line-height:1.5}.small{font-size:12px;line-height:1.5;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.chip{border:1px solid #dce5e1;background:#fafcfb;border-radius:999px;padding:7px 9px;font-size:11px;font-weight:800}.btn{display:block;width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,var(--deep),var(--green));color:#fff;padding:14px;font-size:14px;font-weight:850;margin-top:13px;text-align:center}.btn.sec{background:#fff;color:var(--deep);border:1px solid #c8ded6}.screen{display:none}.screen.on{display:block}.progress{display:flex;gap:5px;margin:12px 0 16px}.dot{height:5px;flex:1;background:#d9e5e0;border-radius:10px}.dot.on{background:linear-gradient(90deg,var(--deep),var(--green))}.objective{background:linear-gradient(145deg,#075f51,#087a63 52%,#01a982);color:#fff;border-radius:18px;padding:16px;margin-top:12px}.objective .small{color:rgba(255,255,255,.86)}.version{font-size:10px;color:var(--muted);text-align:center;padding:16px 10px 26px}</style></head><body><div class="app"><header><button class="mini" onclick="back()">←</button><b>Cisco Replacement Navigator</b><button class="mini" onclick="toggleLang()" id="langBtn">EN</button><button class="mini" onclick="home()">Home</button></header><main><section id="home" class="screen on"><div class="eyebrow" id="homeEye"></div><h1>Cisco Replacement Navigator</h1><p class="lead" id="homeLead"></p><div class="grid" id="homeGrid"></div></section><section id="journey" class="screen"><div class="eyebrow" id="journeyEye"></div><h1 id="journeyTitle"></h1><p class="lead" id="journeyLead"></p><div class="chips" id="journeyChips"></div><div class="objective"><b id="strategyLabel"></b><div class="small" id="journeyStrategy"></div></div><button class="btn" id="startBtn" onclick="startJourney()"></button><button class="btn sec" id="mappingBtn" onclick="showMapping()"></button></section><section id="step" class="screen"><div id="prog" class="progress"></div><div class="eyebrow" id="stepEye"></div><h1 id="stepTitle"></h1><div class="panel"><div class="label" id="askLabel"></div><div class="say" id="stepAsk"></div></div><div class="panel"><div class="label" id="painLabel"></div><div class="small" id="stepPain"></div></div><div class="panel"><div class="label" id="respLabel"></div><div class="small" id="stepResp"></div></div><div class="panel"><div class="label" id="collectLabel"></div><div class="chips" id="stepCollect"></div></div><button class="btn" id="nextBtn" onclick="nextStep()"></button><button class="btn sec" id="overviewBtn" onclick="showJourney()"></button></section><section id="mapping" class="screen"><div class="eyebrow" id="mapEye"></div><h1 id="mapTitle"></h1><div id="mapCards"></div><button class="btn sec" id="mapBack" onclick="showJourney()"></button></section></main><div class="version">v1.2-FULL-5-JOURNEYS · 2026-08-31 18:12 JST · Public Test · noindex</div></div><script>const L={zh:{homeEye:'HPE Networking · Sales Coach',homeLead:'從客戶情境開始，不急著談型號。五條產品線都使用完整 7 層 Discovery，先問對問題，再做產品與遷移判斷。',strategy:'核心策略',start:'開始 7 層 Discovery',mapping:'直接看 Cisco → HPE Mapping',ask:'建議開場 / 問題',pain:'預期客戶反應 / 痛點',resp:'我們怎麼回應',collect:'必須蒐集',next:'下一步 →',viewMap:'看 Mapping →',overview:'回到 7 層總覽',mapBack:'回到 Journey',steps:['1 開場','2 問題','3 客戶反應','4 如何回應','5 必要蒐集','6 Mapping','7 Proof / POC']},en:{homeEye:'HPE Networking · Sales Coach',homeLead:'Start with the customer situation, not the SKU. All five product lines use a complete 7-step discovery flow before product and migration decisions.',strategy:'Core strategy',start:'Start 7-Step Discovery',mapping:'View Cisco → HPE Mapping',ask:'Suggested opening / Question',pain:'Expected response / Pain',resp:'How we respond',collect:'Must collect',next:'Next →',viewMap:'View Mapping →',overview:'Back to 7-step overview',mapBack:'Back to Journey',steps:['1 Opening','2 Question','3 Expected Response','4 How to Respond','5 Data to Collect','6 Mapping','7 Proof / POC']}};const J={dcn:{n:['Data Center Networking','Data Center Networking'],d:['ACI · Nexus · Brownfield · Greenfield · EVPN-VXLAN · Migration','ACI · Nexus · Brownfield · Greenfield · EVPN-VXLAN · Migration'],l:['先理解現況、ACI policy dependency、營運風險與 migration appetite，再做 architecture mapping。','Understand the current state, ACI policy dependencies, operational risk, and migration appetite before architecture mapping.'],s:['Greenfield 優先 Juniper。Brownfield 不硬拆 production，先從新 pod、AI workload 或 expansion 切入，再分階段 coexist / migration。','Lead with Juniper for Greenfield. For Brownfield, preserve production and enter through a new pod, AI workload, or expansion, then coexist and migrate in phases.'],q:[['目前 Data Center Network 主要是傳統 Nexus，還是已經使用 ACI？','Is your data center primarily traditional Nexus, or are you already operating ACI?'],['什麼事情讓你們現在開始考慮調整 Data Center Network？','What is causing you to consider changing the data center network now?'],['如果真的要動網路，哪一件事情是你們最不能接受出問題的？','If we touch the network, what absolutely cannot fail?'],['ACI 裡面是單純 segmentation，還是大量使用 EPG、BD、Contract、L3Out、service graph？','Is ACI mainly segmentation, or do you heavily use EPG, BD, Contracts, L3Out, or service graphs?'],['如果不碰現有 production，你們較能接受 coexist、分階段 migration，還是從新環境開始？','If we avoid touching production, would you prefer coexistence, phased migration, or a new environment?'],['團隊目前主要依賴 Cisco CLI / ACI，還是已有 Ansible、API 或 multi-vendor automation？','Does the team mainly rely on Cisco CLI/ACI, or do you already use Ansible, APIs, or multi-vendor automation?'],['下一個最適合導入不同架構的地方在哪裡：新 pod、AI workload、新 DC、擴充區，還是 lab？','Where is the best place to introduce a different architecture: new pod, AI workload, new DC, expansion area, or lab?']],p:[['Nexus 9K、ACI/APIC、傳統 NX-OS，或客戶自己也不確定。','Nexus 9K, ACI/APIC, classic NX-OS, or uncertainty.'],['EOL/EOS、capacity、AI DC、成本、營運複雜、新 DC / pod。','EOL/EOS, capacity, AI DC, cost, operational complexity, or a new DC/pod.'],['Production app、east-west traffic、firewall、compliance、automation、change window。','Production apps, east-west traffic, firewall, compliance, automation, and change windows.'],['越深的 ACI policy dependency，客戶越擔心直接轉換。','The deeper the ACI policy dependency, the greater the fear of direct conversion.'],['No-touch production、coexist first、phased migration、greenfield only。','No-touch production, coexist first, phased migration, or greenfield only.'],['Cisco-only skill、automation mature、multi-vendor、需要 enablement。','Cisco-only skills, mature automation, multi-vendor, or enablement needed.'],['最佳入口通常不是拆 production，而是找新 workload。','The best entry is often a new workload, not ripping out production.']],r:[['先辨認 architecture，不急著談 replacement。','Identify the architecture first; do not rush into replacement.'],['把 trigger 轉成 business reason，不只談設備老舊。','Turn the trigger into a business reason, not just aging hardware.'],['先找不能壞的東西，它決定 migration design 與 rollback。','Identify what cannot break; it drives migration design and rollback.'],['不要承諾 config conversion；先還原 effective policy 與 dependency，再做 target design。','Do not promise config conversion; recover effective policy and dependencies first, then redesign.'],['Brownfield expansion：保留 Cisco production，先贏下一個 workload。','Brownfield expansion: keep Cisco production and win the next workload first.'],['把 operational change 也當成 migration risk，不只看硬體。','Treat operational change as migration risk, not just hardware change.'],['用 POC / brownfield expansion 證明 connectivity、operations、rollback，再逐步擴大。','Use POC/brownfield expansion to prove connectivity, operations, and rollback, then expand.']],c:['Nexus PID|NX-OS / ACI version|APIC|Spine / Leaf|Age / lifecycle','EOL / EOS|Capacity|AI DC|Cost|Operations|New DC / Pod','Production apps|East-West|Firewall|Compliance|Automation|Change window','EPG / BD|Contracts|L3Out|Service Graph / PBR|Shared Services|Gateway','New pod / rack|AI workload|DR / expansion|Routing boundary|Rollback|Shared services','Team skill|Automation|Change process|Validation|Training|Ownership','AI DC|New pod|New DC|Expansion|Lab / POC|Success criteria'],m:[['Cisco ACI + APIC','Juniper QFX + Apstra + EVPN-VXLAN'],['Nexus Leaf / ToR','Juniper QFX51xx family'],['Nexus Spine / high-speed','Juniper QFX52xx / modular QFX']]},campus:{n:['Campus / Branch','Campus / Branch'],d:['Catalyst · Branch · SD-WAN · SASE','Catalyst · Branch · SD-WAN · SASE'],l:['從使用者、站點、核心／接入、WAN 與營運體驗開始，找出最適合的替換或共存入口。','Start with users, sites, core/access, WAN, and operational experience to identify the best replacement or coexistence entry point.'],s:['不要只比 Catalyst 型號。先釐清 campus 架構、分支 WAN、管理平台與 user experience，再決定 Aruba CX、Juniper campus 或分階段 coexist。','Do not compare Catalyst SKUs only. Clarify campus architecture, branch WAN, management platform, and user experience before choosing Aruba CX, Juniper campus, or phased coexistence.'],q:[['目前 Campus / Branch 主要使用哪些 Cisco 平台？Catalyst、Meraki、ISR，還是混合？','Which Cisco platforms run your Campus/Branch today: Catalyst, Meraki, ISR, or a mix?'],['現在最想改善的是設備老化、管理複雜、branch WAN、還是使用者體驗？','What do you most want to improve: aging hardware, operational complexity, branch WAN, or user experience?'],['哪一類站點最不能出問題：總部、工廠、門市、分行，還是大型辦公室？','Which site type cannot fail: HQ, factory, retail, branch, or large office?'],['現在 Cisco policy / template 有多一致？每個 site 是否很多例外？','How consistent are Cisco policies/templates today? Are there many site exceptions?'],['你們願意先從哪些低風險站點做 pilot？','Which lower-risk sites could be used for a pilot?'],['管理面你們偏好單一雲管理、on-prem，還是 hybrid？','Do you prefer single-cloud management, on-prem, or hybrid?'],['哪個 site / region 最適合做第一個 production proof？','Which site or region is best for the first production proof?']],p:[['常見是 Catalyst access/core，加上不同世代 branch router 或 Meraki。','Often Catalyst access/core plus different generations of branch routers or Meraki.'],['EOL、太多管理工具、WAN 成本、Wi-Fi 抱怨、troubleshooting 慢。','EOL, too many tools, WAN cost, Wi-Fi complaints, or slow troubleshooting.'],['Critical sites 對 downtime、PoE、voice、OT、guest network 要求不同。','Critical sites have different downtime, PoE, voice, OT, and guest requirements.'],['大量例外會讓 migration 比換 switch 更困難。','Many exceptions make migration harder than replacing switches.'],['常見：小型 office、new branch、refresh site。','Common: small office, new branch, or scheduled refresh site.'],['客戶可能對 cloud management、資料位置或流程有顧慮。','Customers may have concerns about cloud management, data location, or workflow.'],['成功標準通常是穩定、部署時間、troubleshooting、使用者體驗。','Success usually means stability, deployment time, troubleshooting, and user experience.']],r:[['先畫出 site 類型與管理邊界。','Map site types and management boundaries first.'],['把硬體更新轉成營運與體驗改善。','Turn hardware refresh into operational and experience improvement.'],['先分 site persona，再談 rollout。','Segment site personas before rollout.'],['先標準化 intent，再逐站 migration。','Standardize intent first, then migrate site by site.'],['先做可複製的 golden design。','Create a repeatable golden design first.'],['把管理模型與操作流程一起納入選型。','Include the management and operating model in platform selection.'],['用 pilot 證明後再形成 migration wave。','Prove the pilot, then build migration waves.']],c:['Catalyst model|Core / access|Meraki|ISR / branch|Site count|Controller / cloud','EOL|Tool sprawl|WAN cost|User experience|Troubleshooting|Refresh cycle','Critical sites|PoE|Voice|OT|Guest|Change window','Templates|VLAN / VRF|ACL|QoS|Exceptions|Authentication','Pilot sites|New branch|Refresh schedule|User groups|Rollback|Success criteria','Cloud policy|RBAC|Ops workflow|API|Compliance|NOC model','Pilot site|Deployment time|SLA|UX baseline|Ops effort|Rollout wave'],m:[['Catalyst access / core','Aruba CX or Juniper EX'],['Cisco campus management','Aruba Central or Juniper Mist'],['ISR / branch WAN','HPE Networking SD-WAN options by design']]},security:{n:['Security','Security'],d:['Firewall · Policy · Segmentation','Firewall · Policy · Segmentation'],l:['先釐清 firewall、segmentation、identity、traffic flow 與 policy dependency；安全不能只做 appliance 對 appliance。','Clarify firewall, segmentation, identity, traffic flow, and policy dependencies first; security cannot be reduced to appliance-to-appliance replacement.'],s:['先還原安全 policy intent 與 east-west / north-south traffic，再決定哪些能力由 firewall、network segmentation、SASE 或 cloud security 承擔。','Recover security policy intent and east-west/north-south traffic first, then decide what belongs to firewall, network segmentation, SASE, or cloud security.'],q:[['目前 Cisco security stack 有哪些：Firepower、ASA、ISE、Umbrella、Secure Access？','Which Cisco security components are in place: Firepower, ASA, ISE, Umbrella, Secure Access?'],['目前最痛的是 policy 變更慢、troubleshooting、remote access，還是 segmentation？','What hurts most: slow policy change, troubleshooting, remote access, or segmentation?'],['哪些 application / flow 最敏感，不能在 migration 中被誤阻擋？','Which applications or flows are most sensitive and must not be blocked during migration?'],['現有 firewall rules 有多少是 still-used，多少可能是 legacy？','How many current firewall rules are still used versus legacy?'],['你們能接受 parallel firewall / policy coexist 嗎？','Can you accept parallel firewall/policy coexistence?'],['安全營運由 NetOps、SecOps 還是 SOC 主導？','Is security operations led by NetOps, SecOps, or SOC?'],['哪個非核心 flow / site 最適合做 proof？','Which non-core flow or site is best for proof?']],p:[['很多客戶其實是多產品拼接，ownership 分散。','Many customers have a mixed stack with fragmented ownership.'],['常見是規則太多、責任不清、變更窗口長。','Common issues are rule sprawl, unclear ownership, and long change windows.'],['金融、OT、shared service、identity flow 通常最敏感。','Financial, OT, shared services, and identity flows are often most sensitive.'],['客戶通常不知道，直接搬規則會把技術債一起搬走。','Customers often do not know; copying rules also copies technical debt.'],['高風險環境多半要 parallel、分段導流。','High-risk environments usually need parallel paths and staged traffic moves.'],['ownership 不清會讓新平台導入卡住。','Unclear ownership can block platform adoption.'],['先證明 policy correctness、visibility、rollback，再擴大。','Prove policy correctness, visibility, and rollback before expanding.']],r:[['先畫 security control map。','Build a security control map first.'],['把痛點對應到 policy lifecycle，而不是只換設備。','Map pain to policy lifecycle, not just hardware replacement.'],['先建立 critical flow inventory 與 rollback。','Build a critical-flow inventory and rollback plan first.'],['先做 rule rationalization，再談 migration。','Rationalize rules before migration.'],['設計可回切的 migration wave。','Design reversible migration waves.'],['把 RBAC、workflow、logging、SIEM integration 一起設計。','Design RBAC, workflow, logging, and SIEM integration together.'],['POC 必須用真實 policy / traffic，不只 lab demo。','POC should use realistic policy and traffic, not only a lab demo.']],c:['Firewall|ISE / NAC|Umbrella|VPN|SASE|Cloud security','Policy change|Rule count|Remote access|Segmentation|Troubleshooting|Audit','Critical apps|North-south|East-west|Identity|OT|Shared services','Rule usage|Objects|NAT|VPN|Zones|Expired rules','Parallel path|Routing|NAT|Policy sync|Rollback|Change window','Owners|RBAC|SIEM|Logging|Automation|Approval flow','Pilot flow|Real policy|Visibility|Rollback|Audit|Success criteria'],m:[['Cisco firewall estate','Map by required NGFW / SASE capability'],['Cisco ISE / NAC dependency','Preserve identity and policy integration'],['ACI segmentation contracts','Translate effective segmentation intent']]},switchwifi:{n:['Switch / Wi-Fi','Switch / Wi-Fi'],d:['Access · Core · Wireless','Access · Core · Wireless'],l:['從有線、無線、PoE、identity 與 troubleshooting 一起看，不把 Wi-Fi 當成單獨 AP 更換。','Evaluate wired, wireless, PoE, identity, and troubleshooting together instead of treating Wi-Fi as an AP-only refresh.'],s:['把 switching + Wi-Fi 當成 end-user connectivity architecture。先找 user experience 與操作痛點，再決定 Aruba 或 Juniper Mist 的切入方式。','Treat switching + Wi-Fi as an end-user connectivity architecture. Start with user experience and operational pain, then choose the Aruba or Juniper Mist entry path.'],q:[['目前有線與 Wi-Fi 使用哪些 Cisco 平台與 controller？','Which Cisco wired and Wi-Fi platforms/controllers are in use today?'],['使用者最常抱怨 coverage、performance、roaming，還是 troubleshooting 太慢？','Do users complain most about coverage, performance, roaming, or slow troubleshooting?'],['哪些裝置最敏感：voice、scanner、IoT、medical、OT？','Which devices are most sensitive: voice, scanners, IoT, medical, or OT?'],['目前 authentication 與 segmentation 怎麼做？802.1X、MAB、VLAN、ACL？','How are authentication and segmentation handled: 802.1X, MAB, VLAN, ACL?'],['哪個樓層 / site 可以先做局部 pilot？','Which floor or site could be used for a limited pilot?'],['NOC 最想改善哪個 Day-2 工作？','Which Day-2 task does the NOC most want to improve?'],['POC 成功要證明什麼：coverage、SLE、MTTR、部署速度？','What must the POC prove: coverage, SLE, MTTR, or deployment speed?']],p:[['常見是 Catalyst + Cisco wireless，多世代並存。','Often Catalyst plus Cisco wireless with multiple generations.'],['IT 常只有「Wi-Fi 不好」但缺少 end-to-end evidence。','IT often hears “Wi-Fi is bad” without end-to-end evidence.'],['不同 client 對 roaming、latency、security 要求差很多。','Different clients have very different roaming, latency, and security needs.'],['真正 migration 常卡在 identity / policy，不是 AP。','Real migration often gets stuck on identity/policy, not AP hardware.'],['客戶通常能接受 isolated floor / new area。','Customers often accept an isolated floor or new area.'],['找 root cause、client journey、RF 調校、firmware、ticket triage。','Root cause, client journey, RF tuning, firmware, or ticket triage.'],['沒有 success criteria 的 Wi-Fi POC 很容易變成主觀比較。','Without success criteria, Wi-Fi POCs become subjective.']],r:[['先確認 wired/wireless 邊界與 controller 模式。','Confirm wired/wireless boundaries and controller mode first.'],['把問題轉成可量測 SLE / experience 指標。','Turn complaints into measurable SLE/experience metrics.'],['先分 client persona 與 critical use case。','Segment client personas and critical use cases first.'],['把 wired/wireless policy 一起 mapping。','Map wired and wireless policy together.'],['先比較 baseline 與新體驗。','Compare the baseline with the new experience.'],['把 AIOps / automation 價值量化。','Quantify AIOps/automation value.'],['先訂 KPI，再做 production pilot。','Define KPIs before a production pilot.']],c:['Switch model|AP model|Controller|PoE|SSID|Site count','Coverage|Capacity|Roaming|Latency|Drops|Ticket volume','Voice|IoT|OT|Scanner|Medical|Guest','802.1X|MAB|VLAN|ACL|Guest|NAC','Pilot area|Baseline|AP density|Switch ports|User mix|Rollback','MTTR|Tickets|RF ops|Client trace|Firmware|Automation','SLE|Coverage|MTTR|Deployment time|Ticket rate|User feedback'],m:[['Catalyst access switching','Aruba CX or Juniper EX'],['Cisco Wireless LAN','Aruba WLAN or Juniper Mist WLAN'],['Cisco controller-led ops','Map to Central or Mist cloud operations']]},mist:{n:['Mist / AI Operations','Mist / AI Operations'],d:['AIOps · Assurance · Day-2 Operations','AIOps · Assurance · Day-2 Operations'],l:['Mist 不是只賣 Wi-Fi；要從 Day-2 operations、SLE、Marvis 與跨 wired/wireless troubleshooting 的價值切入。','Mist is not just Wi-Fi. Lead with Day-2 operations, SLEs, Marvis, and cross-domain wired/wireless troubleshooting value.'],s:['先找 IT 每天最耗時間的 network operations 工作，再用可量化的 MTTR、ticket、SLE 與 automation proof 建立價值，不強迫一次全雲化。','Find the network operations tasks consuming the most time, then prove value with measurable MTTR, ticket, SLE, and automation outcomes without forcing an all-at-once cloud move.'],q:[['現在 IT 如何監控使用者網路體驗？主要看 device health，還是有 user-level insight？','How does IT monitor user network experience today: device health only, or user-level insight?'],['網路出問題時，最花時間的是找 root cause、跨有線無線追問題，還是缺少主動預警？','When the network fails, is the biggest burden root-cause analysis, cross-domain troubleshooting, or lack of proactive warning?'],['哪些使用者 / 應用最需要穩定 experience？','Which users or applications most need consistent experience?'],['你們對 cloud-managed network 最大顧慮是什麼？','What is your biggest concern about cloud-managed networking?'],['可否先選一個 site / floor 做 Mist pilot，而不是全面替換？','Can we start with one site or floor as a Mist pilot instead of a full replacement?'],['誰會每天使用 Mist / Marvis：NOC、helpdesk、network engineer？','Who would use Mist/Marvis every day: NOC, helpdesk, or network engineers?'],['POC 要用哪些數字證明值得：MTTR、ticket reduction、SLE、部署速度？','Which numbers should prove value: MTTR, ticket reduction, SLE, or deployment speed?']],p:[['多數工具看設備 up/down，卻不知道使用者為什麼覺得慢。','Most tools show device up/down but not why users feel the network is slow.'],['常見 pain 是 MTTR 長、資料散在不同工具。','Common pain is long MTTR and fragmented data across tools.'],['Executive、voice、critical app、warehouse、branch 都可能有不同 SLE。','Executives, voice, critical apps, warehouses, and branches can require different SLEs.'],['可能是 security、data residency、change control、vendor lock-in。','It may be security, data residency, change control, or vendor lock-in.'],['小範圍 proof 能降低對雲與新操作模式的心理阻力。','A small proof reduces resistance to cloud and a new operating model.'],['若沒有 owner，再好的 AI 功能也不會落地。','Without clear owners, even strong AI features will not land.'],['Demo 很漂亮不代表會買；要有 before / after。','A beautiful demo does not guarantee a purchase; we need before/after evidence.']],r:[['先把 device-centric 轉成 user-experience-centric。','Shift from device-centric to user-experience-centric operations.'],['找一個高頻 troubleshooting use case 來證明 AIOps。','Choose a high-frequency troubleshooting use case to prove AIOps.'],['用 SLE 定義「好」而不是只看 uptime。','Use SLEs to define “good,” not uptime alone.'],['不要硬推雲；逐一回答 governance 與 operating model。','Do not force cloud; address governance and operating model concerns one by one.'],['先證明 Day-2 value，再談擴大。','Prove Day-2 value first, then expand.'],['把 persona、workflow、權限與 escalation 一起設計。','Design personas, workflow, permissions, and escalation together.'],['先定 baseline，再做 production proof 與 executive summary。','Set a baseline, then run a production proof and executive summary.']],c:['Monitoring tools|NOC workflow|Tickets|Client visibility|Baselines|SLA','MTTR|Tool count|Escalations|Root cause|Proactive alerts|Ticket volume','Critical users|Apps|Voice|Latency|Roaming|Success threshold','Security review|Data policy|RBAC|Change control|API|Cloud acceptance','Pilot site|Users|Baseline|Tickets|SLE|Rollback','Users|Roles|RBAC|Workflow|Escalation|Training','Baseline|MTTR|Tickets|SLE|Deployment time|Executive KPI'],m:[['Cisco device-centric monitoring','Juniper Mist Assurance / SLE'],['Manual troubleshooting','Marvis AI-assisted operations'],['Separate wired / wireless tools','Unified Mist operations where applicable']]}};let lang='zh',current='home',journey='dcn',stepNo=1;const ix=()=>lang==='zh'?0:1,t=k=>L[lang][k];function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');window.scrollTo(0,0)}function renderHome(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';langBtn.textContent=lang==='zh'?'EN':'中';homeEye.textContent=t('homeEye');homeLead.textContent=t('homeLead');homeGrid.innerHTML=['dcn','campus','security','switchwifi','mist'].map((k,i)=>`<div class="tile ${i===0?'primary':''}" onclick="openJourney('${k}')"><div class="eyebrow">${i===0?'Priority · Deep Dive':'Product Line'}</div><h2>${J[k].n[ix()]}</h2><p>${J[k].d[ix()]}</p><div class="go">${lang==='zh'?'開啟':'Open'} →</div></div>`).join('')}function openJourney(k){journey=k;current='journey';renderJourney();show('journey')}function showJourney(){current='journey';renderJourney();show('journey')}function renderJourney(){let j=J[journey];journeyEye.textContent=j.n[ix()]+' · Guided Discovery';journeyTitle.textContent=lang==='zh'?'7 層 Discovery':'7-Step Discovery';journeyLead.textContent=j.l[ix()];journeyChips.innerHTML=t('steps').map(x=>`<span class="chip">${x}</span>`).join('');strategyLabel.textContent=t('strategy');journeyStrategy.textContent=j.s[ix()];startBtn.textContent=t('start');mappingBtn.textContent=t('mapping')}function startJourney(){stepNo=1;current='step';renderStep();show('step')}function renderStep(){let j=J[journey],i=stepNo-1;stepEye.textContent=j.n[ix()]+' · '+stepNo+' / 7';stepTitle.textContent=t('steps')[i];askLabel.textContent=t('ask');painLabel.textContent=t('pain');respLabel.textContent=t('resp');collectLabel.textContent=t('collect');stepAsk.textContent=j.q[i][ix()];stepPain.textContent=j.p[i][ix()];stepResp.textContent=j.r[i][ix()];stepCollect.innerHTML=j.c[i].split('|').map(x=>`<span class="chip">${x}</span>`).join('');prog.innerHTML=[1,2,3,4,5,6,7].map(x=>`<span class="dot ${x<=stepNo?'on':''}"></span>`).join('');nextBtn.textContent=stepNo<7?t('next'):t('viewMap');overviewBtn.textContent=t('overview')}function nextStep(){if(stepNo<7){stepNo++;renderStep();window.scrollTo(0,0)}else showMapping()}function showMapping(){current='mapping';let j=J[journey];mapEye.textContent=j.n[ix()]+' · Architecture Mapping';mapTitle.textContent='Cisco → HPE';mapCards.innerHTML=j.m.map(m=>`<div class="card"><div class="label">${m[0]}</div><h2>${m[1]}</h2></div>`).join('');mapBack.textContent=t('mapBack');show('mapping')}function toggleLang(){lang=lang==='zh'?'en':'zh';renderHome();if(current==='journey')renderJourney();if(current==='step')renderStep();if(current==='mapping')showMapping()}function home(){current='home';renderHome();show('home')}function back(){if(current==='home')return;if(current==='step'||current==='mapping'){showJourney();return}home()}renderHome();</script></body></html>
